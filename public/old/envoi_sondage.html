<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Créer un Sondage</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #36393F;
            color: #DCDDDE;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
            background-color: #2F3136;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
        }
        h1 {
            text-align: center;
            color: #FFFFFF;
        }
        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }
        input[type="text"] {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border-radius: 4px;
            border: 1px solid #202225;
            background-color: #202225;
            color: #DCDDDE;
        }
        button {
            display: block;
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            background-color: #5865F2;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: #4752C4;
        }
        .response-input {
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Créer un Sondage</h1>
        <label for="question">Question :</label>
        <input type="text" id="question" placeholder="Saisissez votre question ici">

        <label>Réponses possibles :</label>
        <input type="text" class="response-input" id="response1" placeholder="Réponse 1">
        <input type="text" class="response-input" id="response2" placeholder="Réponse 2">
        <input type="text" class="response-input" id="response3" placeholder="Réponse 3">
        <input type="text" class="response-input" id="response4" placeholder="Réponse 4">
        <input type="text" class="response-input" id="response5" placeholder="Réponse 5">

        <button onclick="lancerSondage()">Lancer le Sondage</button>
    </div>

    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <script>
        // Connexion au serveur WebSocket
        const socket = io('https://blast-mg48.onrender.com');

        function lancerSondage() {
            const question = document.getElementById('question').value;
            const reponses = [];
            for (let i = 1; i <= 5; i++) {
                const reponse = document.getElementById(`response${i}`).value;
                if (reponse) {
                    reponses.push(reponse);
                }
            }

            if (!question || reponses.length < 2) {
                alert("Veuillez saisir une question et au moins deux réponses.");
                return;
            }

            // Envoi des données du sondage au serveur
            socket.emit('nouveau_sondage', { question, reponses });

            alert(`Sondage lancé avec la question : "${question}" et ${reponses.length} réponses possibles.`);
        }
    </script>
</body>
</html>
