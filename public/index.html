<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sondage Interactif</title>
    <style>
        iframe {
            transform: scale(1);
            transform-origin: 0 0;
            width: 100%;
            height: 100%;
        }
        #sondage-container {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
            z-index: 1000;
            display: none;
        }
        #sondage-container h2 {
            margin-top: 0;
        }
        #sondage-container button {
            margin: 5px;
            padding: 8px 15px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div style="height: 100%; overflow: hidden; position: relative; padding-top: 75%;">
        <iframe
            src="./discFrame.html"
            style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none;"
            frameborder="0"
            scrolling="no">
        </iframe>
    </div>

    <div id="sondage-container">
        <h2>Sondage</h2>
        <p>Quelle est votre option préférée ?</p>
        <button onclick="voter('Option 1')">Option 1</button>
        <button onclick="voter('Option 2')">Option 2</button>
        <button onclick="voter('Option 3')">Option 3</button>
        <p id="merci-message" style="display: none; color: green;">Merci pour votre vote !</p>
    </div>

    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <script>
        // Connexion au serveur WebSocket
        const socket = io('http://localhost:3000');

        // Écoutez l'événement pour afficher le sondage
        socket.on('afficher_sondage', () => {
            const sondageContainer = document.getElementById('sondage-container');
            sondageContainer.style.display = 'block';
        });

        // Fonction pour voter
        function voter(option) {
            fetch('http://localhost:3000/vote', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ option: option }),
            })
            .then(response => response.json())
            .then(data => {
                console.log('Succès:', data);
                document.getElementById('merci-message').style.display = 'block';

                // Masquer le sondage après 2 secondes
                setTimeout(() => {
                    document.getElementById('sondage-container').style.display = 'none';
                }, 2000);
            })
            .catch((error) => {
                console.error('Erreur:', error);
            });
        }
    </script>
</body>
</html>
